name: Offline submission validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/verify_submission.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-validation
          path: |
            examples/submission-validation.json
            examples/test-results-current.txt
